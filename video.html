
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Video For You 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #180c2e, #57265f, #25113e);
    }

    .video-card {
      width: 100%;
      max-width: 650px;
      padding: 26px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      background: rgba(255,255,255,0.09);
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }

    h1 {
      color: #ffd6f4;
      font-size: clamp(25px, 6vw, 38px);
    }

    .message {
      line-height: 1.7;
      color: #f7eafa;
    }

    video {
      display: block;
      width: 100%;
      max-height: 65vh;
      margin: 24px auto;
      border-radius: 16px;
      background: #10091a;
    }

    .back-button {
      display: inline-block;
      margin-top: 12px;
      padding: 13px 22px;
      border-radius: 30px;
      background: #f3b4e5;
      color: #35113d;
      font-weight: bold;
      text-decoration: none;
    }

    .back-button:hover {
      background: white;
    }

    .heart {
      font-size: 28px;
    }
  </style>
</head>

<body>
  <main class="video-card">
    <div class="heart">💜 🎂 💗</div>

    <h1>A Little Video Just for You</h1>

    <p class="message">
      Every moment with you is special. ❤️<br>
      This little video is made with all my love.
      <br>Happy Birthday, my love! 💕
    </p>

    <iframe
  src="https://drive.google.com/file/d/1-2EM0QjCdJGw2cKOquiNuXvU2H4Fwm-F/preview"
  width="100%"
  height="360"
  style="border:0; border-radius:16px;"
  allow="autoplay; fullscreen"
  allowfullscreen>
    </iframe>

    <p class="message">
      No matter how many birthdays pass,
      you'll always be special to me. 💖
    </p>

    <a class="back-button" href="index.html">
      ← Back to Home
    </a>
  </main>
</body>
</html>
